<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-label="Top view of a motorboat moored with its starboard side to a pier, showing bow line, stern line, bow spring and stern spring."><style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#13232B; --ink-soft:#4A5D66; --rule:#C9D4D8;
  --accent:#0B6A78; --cmd-bg:#DDE9ED;
  --water:#D3E5EC; --pier:#B7B1A6; --bank:#BCD0B1; --bridge:#8F9AA0; --pillar:#5F686D;
  --hull:#FFFFFF; --hull-stroke:#13232B; --deck:#D5DEE2; --motor:#13232B;
  --port:#C62F36; --stbd:#1C8A4A; --rope:#A06A14; --fender:#1F3F57; --current:#2A78A0;
  --warn:#9A5B00; --warn-bg:#FBEFD9;
}
@media (prefers-color-scheme: dark){:root{
  
  --bg:#0D171C; --surface:#13222A; --ink:#DCE7EA; --ink-soft:#97A9B1; --rule:#26363E;
  --accent:#4CC0CF; --cmd-bg:#18303A;
  --water:#12303B; --pier:#4E4A43; --bank:#243A29; --bridge:#3A474E; --pillar:#8A959B;
  --hull:#E6ECEE; --hull-stroke:#0D171C; --deck:#9FB0B7; --motor:#05090B;
  --port:#F0636A; --stbd:#3FC47A; --rope:#E0A64A; --fender:#8FB3CC; --current:#6FB9DE;
  --warn:#F2B75B; --warn-bg:#2A2214;
}}
.lbl{fill:var(--ink);font:600 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sm{fill:var(--ink-soft);font:600 11.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.rp{fill:var(--rope);font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.pt{fill:var(--port);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sb{fill:var(--stbd);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ac{fill:var(--accent);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs>
    <symbol id="boat" viewBox="0 0 40 112" overflow="visible">
      <path d="M20 0 C33 16 40 36 40 58 L40 96 Q40 100 36 100 L4 100 Q0 100 0 96 L0 58 C0 36 7 16 20 0 Z" style="fill:var(--hull);stroke:var(--hull-stroke);stroke-width:1.5"/>
      <rect x="8" y="46" width="24" height="24" rx="3" style="fill:var(--deck);stroke:var(--hull-stroke);stroke-width:1"/>
      <rect x="15" y="100" width="10" height="11" rx="2" style="fill:var(--motor)"/>
      <circle cx="9" cy="24" r="3.2" style="fill:var(--port)"/>
      <circle cx="31" cy="24" r="3.2" style="fill:var(--stbd)"/>
    </symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--current)"/>
    </marker>
    <marker id="arri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--ink-soft)"/>
    </marker>
  </defs><rect width="640" height="330" style="fill:var(--water)"/>
        <!-- direction arrows -->
        <line x1="470" y1="40" x2="600" y2="40" style="stroke:var(--accent)" stroke-width="2" marker-end="url(#arr)"/>
        <text class="ac" x="470" y="30">voraus (forward)</text>
        <line x1="170" y1="40" x2="40" y2="40" style="stroke:var(--accent)" stroke-width="2" marker-end="url(#arr)"/>
        <text class="ac" x="170" y="30" text-anchor="end">achteraus (backward)</text>
        <!-- pier -->
        <rect x="0" y="226" width="640" height="104" style="fill:var(--pier)"/>
        <line x1="0" y1="226" x2="640" y2="226" style="stroke:var(--hull-stroke)" stroke-width="1.5"/>
        <!-- lines -->
        <g style="stroke:var(--rope)" stroke-width="2.4" fill="none" stroke-linecap="round">
          <path d="M404 176 L470 240"/>
          <path d="M196 176 L130 240"/>
          <path d="M382 204 L250 240"/>
          <path d="M218 204 L350 240"/>
        </g>
        <g style="fill:var(--hull-stroke)">
          <circle cx="470" cy="240" r="6"/><circle cx="130" cy="240" r="6"/><circle cx="250" cy="240" r="6"/><circle cx="350" cy="240" r="6"/>
        </g>
        <!-- fenders -->
        <g style="fill:var(--fender)">
          <ellipse cx="255" cy="215" rx="9" ry="5"/><ellipse cx="300" cy="215" rx="9" ry="5"/><ellipse cx="345" cy="215" rx="9" ry="5"/>
        </g>
        <!-- boat -->
        <g transform="translate(300,170) rotate(90) scale(2) translate(-20,-56)"><use href="#boat" width="40" height="112"/></g>
        <text class="lbl" x="424" y="166">Bug (bow)</text>
        <text class="lbl" x="160" y="160" text-anchor="end">Heck (stern)</text>
        <text class="sm" x="160" y="176" text-anchor="end">Außenborder</text>
        <text class="pt" x="300" y="112" text-anchor="middle">Backbord (port, links) · rot</text>
        <!-- line labels -->
        <text class="rp" x="130" y="266" text-anchor="middle">Achterleine</text>
        <text class="rp" x="250" y="266" text-anchor="middle">Vorspring</text>
        <text class="rp" x="350" y="266" text-anchor="middle">Achterspring</text>
        <text class="rp" x="470" y="266" text-anchor="middle">Vorleine</text>
        <text class="sb" x="300" y="296" text-anchor="middle">Steuerbord (starboard, rechts) · grün — liegt an der Pier</text>
        <text class="sm" x="300" y="316" text-anchor="middle">Pier / Steg · ● Poller · dunkle Ovale = Fender</text>
      </svg>