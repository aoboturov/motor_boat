<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-label="Top view of a river with current flowing from the bridge toward the approaching boat. The boat approaches the pillar upstream, shifts to neutral about three boat lengths before, briefly reverses to stop, and holds position about one metre from the pillar using a mark on the bank abeam."><style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#13232B; --ink-soft:#4A5D66; --rule:#C9D4D8;
  --accent:#0B6A78; --cmd-bg:#DDE9ED;
  --water:#D3E5EC; --pier:#B7B1A6; --bank:#BCD0B1; --bridge:#8F9AA0; --pillar:#5F686D;
  --hull:#FFFFFF; --hull-stroke:#13232B; --deck:#D5DEE2; --motor:#13232B;
  --port:#C62F36; --stbd:#1C8A4A; --rope:#A06A14; --fender:#1F3F57; --current:#2A78A0;
  --warn:#9A5B00; --warn-bg:#FBEFD9;
}
@media (prefers-color-scheme: dark){:root{
  
  --bg:#0D171C; --surface:#13222A; --ink:#DCE7EA; --ink-soft:#97A9B1; --rule:#26363E;
  --accent:#4CC0CF; --cmd-bg:#18303A;
  --water:#12303B; --pier:#4E4A43; --bank:#243A29; --bridge:#3A474E; --pillar:#8A959B;
  --hull:#E6ECEE; --hull-stroke:#0D171C; --deck:#9FB0B7; --motor:#05090B;
  --port:#F0636A; --stbd:#3FC47A; --rope:#E0A64A; --fender:#8FB3CC; --current:#6FB9DE;
  --warn:#F2B75B; --warn-bg:#2A2214;
}}
.lbl{fill:var(--ink);font:600 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sm{fill:var(--ink-soft);font:600 11.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.rp{fill:var(--rope);font:700 12px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.pt{fill:var(--port);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sb{fill:var(--stbd);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ac{fill:var(--accent);font:700 13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style><defs>
    <symbol id="boat" viewBox="0 0 40 112" overflow="visible">
      <path d="M20 0 C33 16 40 36 40 58 L40 96 Q40 100 36 100 L4 100 Q0 100 0 96 L0 58 C0 36 7 16 20 0 Z" style="fill:var(--hull);stroke:var(--hull-stroke);stroke-width:1.5"/>
      <rect x="8" y="46" width="24" height="24" rx="3" style="fill:var(--deck);stroke:var(--hull-stroke);stroke-width:1"/>
      <rect x="15" y="100" width="10" height="11" rx="2" style="fill:var(--motor)"/>
      <circle cx="9" cy="24" r="3.2" style="fill:var(--port)"/>
      <circle cx="31" cy="24" r="3.2" style="fill:var(--stbd)"/>
    </symbol>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/>
    </marker>
    <marker id="arrc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--current)"/>
    </marker>
    <marker id="arri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--ink-soft)"/>
    </marker>
  </defs><rect width="720" height="620" style="fill:var(--water)"/>
        <rect x="0" y="0" width="34" height="620" style="fill:var(--bank)"/>
        <rect x="686" y="0" width="34" height="620" style="fill:var(--bank)"/>
        <!-- bridge -->
        <rect x="0" y="46" width="720" height="44" style="fill:var(--bridge)" opacity=".55"/>
        <line x1="0" y1="46" x2="720" y2="46" style="stroke:var(--hull-stroke)" stroke-width="1"/>
        <line x1="0" y1="90" x2="720" y2="90" style="stroke:var(--hull-stroke)" stroke-width="1"/>
        <text class="lbl" x="44" y="73">Brücke</text>
        <path d="M360 24 L384 44 L384 94 L360 114 L336 94 L336 44 Z" style="fill:var(--pillar);stroke:var(--hull-stroke);stroke-width:1.5"/>
        <text class="lbl" x="392" y="22">Brückenpfeiler</text>
        <!-- current -->
        <g style="stroke:var(--current)" stroke-width="2.4" marker-end="url(#arrc)">
          <line x1="110" y1="300" x2="110" y2="370"/><line x1="190" y1="300" x2="190" y2="370"/><line x1="270" y1="300" x2="270" y2="370"/>
          <line x1="110" y1="400" x2="110" y2="470"/><line x1="190" y1="400" x2="190" y2="470"/><line x1="270" y1="400" x2="270" y2="470"/>
        </g>
        <text x="190" y="290" text-anchor="middle" style="fill:var(--current);font:700 13px 'Source Sans 3',sans-serif">Strömung (stromab ↓)</text>
        <!-- path -->
        <line x1="360" y1="615" x2="360" y2="140" style="stroke:var(--ink-soft)" stroke-width="1.5" stroke-dasharray="5 5"/>
        <!-- ghosts -->
        <g opacity=".18" transform="translate(360,526) translate(-20,-56)"><use href="#boat" width="40" height="112"/></g>
        <g opacity=".3" transform="translate(360,324) translate(-20,-56)"><use href="#boat" width="40" height="112"/></g>
        <!-- final boat -->
        <g transform="translate(360,194) translate(-20,-56)"><use href="#boat" width="40" height="112"/></g>
        <!-- 1 m gap -->
        <g style="stroke:var(--accent)" stroke-width="1.6">
          <line x1="326" y1="114" x2="326" y2="138"/><line x1="320" y1="114" x2="332" y2="114"/><line x1="320" y1="138" x2="332" y2="138"/>
        </g>
        <text class="ac" x="316" y="131" text-anchor="end">≈ 1 m</text>
        <!-- abeam transit -->
        <circle cx="20" cy="194" r="8" style="fill:var(--warn)"/>
        <line x1="30" y1="194" x2="338" y2="194" style="stroke:var(--warn)" stroke-width="1.6" stroke-dasharray="6 5"/>
        <text x="44" y="184" style="fill:var(--warn);font:700 12.5px 'Source Sans 3',sans-serif">Querab-Marke (Laterne, Baum, Poller)</text>
        <text x="44" y="212" style="fill:var(--warn);font:600 11.5px 'Source Sans 3',sans-serif">bleibt sie querab → Boot steht über Grund</text>
        <!-- markers + labels -->
        <g style="fill:var(--accent)"><circle cx="360" cy="138" r="5"/><circle cx="360" cy="268" r="5"/><circle cx="360" cy="470" r="5"/></g>
        <g style="stroke:var(--accent)" stroke-width="1.2"><line x1="366" y1="138" x2="440" y2="138"/><line x1="366" y1="268" x2="440" y2="268"/><line x1="366" y1="470" x2="440" y2="470"/></g>
        <text class="lbl" x="448" y="136">Boot steht ≈ 1 m vor dem Pfeiler</text>
        <text class="sm" x="448" y="153">halten: kurz voraus ↔ Leerlauf</text>
        <text class="lbl" x="448" y="266">Noch zu viel Fahrt?</text>
        <text class="sm" x="448" y="283">kurz langsam zurück = aufstoppen</text>
        <text class="lbl" x="448" y="468">Leerlauf ≈ 3 Bootslängen vorher</text>
        <text class="sm" x="448" y="485">Boot gleitet, Strömung bremst mit</text>
        <line x1="400" y1="612" x2="400" y2="572" style="stroke:var(--accent)" stroke-width="2.4" marker-end="url(#arr)"/>
        <text class="lbl" x="412" y="590">Anfahrt gegen den Strom</text>
        <text class="sm" x="412" y="606">langsame Fahrt voraus, Bug auf den Pfeiler</text>
      </svg>