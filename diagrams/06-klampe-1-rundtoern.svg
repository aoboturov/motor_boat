<svg xmlns="http://www.w3.org/2000/svg" width="260" height="190" viewBox="0 0 260 190"><style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --ink:#13232B; --ink-soft:#4A5D66; --rule:#C9D4D8;
  --accent:#0B6A78; --cmd-bg:#DDE9ED;
  --water:#D3E5EC; --pier:#B7B1A6; --bank:#BCD0B1; --bridge:#8F9AA0; --pillar:#5F686D;
  --hull:#FFFFFF; --hull-stroke:#13232B; --deck:#D5DEE2; --motor:#13232B;
  --port:#C62F36; --stbd:#1C8A4A; --rope:#A06A14; --fender:#1F3F57; --current:#2A78A0;
  --warn:#9A5B00; --warn-bg:#FBEFD9;
}
@media (prefers-color-scheme: dark){:root{
  
  --bg:#0D171C; --surface:#13222A; --ink:#DCE7EA; --ink-soft:#97A9B1; --rule:#26363E;
  --accent:#4CC0CF; --cmd-bg:#18303A;
